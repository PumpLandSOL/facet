const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:undefined);return r.json()};
const usd=(n)=>n==null?'—':n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+(+n).toFixed(2);
const px=(n)=>n==null?'—':'$'+(n>=1000?n.toLocaleString('en-US',{maximumFractionDigits:2}):n>=1?n.toFixed(2):n>=0.01?n.toFixed(4):n.toPrecision(3));
const pct=(n)=>n==null?'<span class="mono mut">—</span>':'<span class="mono '+(n>=0?'up':'dn')+'">'+(n>=0?'+':'')+n.toFixed(2)+'%</span>';
const CLS={treasuries:'Treasuries & cash',credit:'Private credit',metals:'Gold & metals',etfs:'ETFs & indices',stocks:'Stocks',property:'Real estate'};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',markets:'<path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/>',verify:'<path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',basket:'<path d="M5 9h14l-1.4 10H6.4zM9 9l3-5 3 5"/>',docs:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',dot:'<circle cx="12" cy="12" r="4"/>',wrap:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>'};
const svg=(k,s)=>'<svg width="'+(s||16)+'" height="'+(s||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>';
const toast=(t)=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3800)};
const gr=(l,size)=>'<span class="gr '+(size||'')+' g-'+l+'" title="FACET grade '+l+'">'+l+'</span>';
const ico=(a,c)=>a.image?'<img '+(c||'')+' src="'+esc(a.image)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<span class="ico"></span>';
const B={get(){try{return JSON.parse(localStorage.getItem('facet_basket')||'[]')}catch(e){return[]}},set(v){try{localStorage.setItem('facet_basket',JSON.stringify(v))}catch(e){}$('bn').textContent=v.length},has(id){return this.get().some(x=>x.id===id)},toggle(id){let v=this.get();if(v.some(x=>x.id===id))v=v.filter(x=>x.id!==id);else{if(v.length>=30){toast('A basket holds up to 30 listings');return true}v.push({id,w:1})}this.set(v);return v.some(x=>x.id===id)}};B.set(B.get());
window.addB=(id,el)=>{const on=B.toggle(id);if(el)el.textContent=on?'In basket':'Add to basket';toast(on?'Added to your basket':'Removed from your basket')};
const href=(a)=>'/asset/'+encodeURIComponent(a.id);
const t4=(items,val)=>'<div class="t4">'+items.slice(0,4).map(a=>'<a href="'+href(a)+'" data-l><div class="im">'+ico(a)+'</div><div class="sy">'+esc(a.symbol)+'</div><div class="v">'+val(a)+'</div></a>').join('')+'</div>';
const prod=(a)=>'<a class="prod" href="'+href(a)+'" data-l><div class="top">'+ico(a)+'<div style="min-width:0;flex:1"><b>'+esc(a.symbol)+'</b><div class="mut" style="font-size:12px">'+esc(CLS[a.cls])+'</div></div>'+gr(a.letter)+'</div><div class="nm">'+esc(a.name)+'</div><div class="px">'+px(a.price)+'</div><div class="ft">'+pct(a.ch24)+'<span class="mut">'+usd(a.mcap)+' cap</span></div></a>';

// ---------- home ----------
let HERO=0,HT=null;
async function home(){
  const h=await api('/api/home');const s=h.stats;if(!s.assets){app.innerHTML='<div class="empty">The marketplace is filling. Listings appear within a minute of start-up.</div>';setTimeout(route,8000);return}
  const sh={};h.shelves.forEach(x=>sh[x.key]=x.items);const logos=(L)=>'<div class="logos">'+L.slice(0,3).map(a=>ico(a)).join('')+'</div>';
  const slides=[['Treasuries & cash','Tokenized treasuries, settled around the clock.','BlackRock, Ondo, Franklin Templeton, Circle and more. Government-backed paper and money funds, held in a wallet.','Shop treasuries','/markets?class=treasuries',sh.treasuries||[]],['Gold & metals','Vaulted gold, from a few dollars.','One token, one ounce, sitting in a named vault. Compare every gold wrapper against the same reference price.','Shop metals','/markets?class=metals',sh.metals||[]],['Stocks & ETFs','Shares and whole indices, on-chain.','Share-backed tokens for the largest companies and the ETFs that track them, tradeable from your own wallet.','Shop stocks','/markets?class=stocks,etfs',(sh.stocks||[]).concat(sh.etfs||[])]];
  app.innerHTML='<section class="hero"><div class="dots">'+slides.map((_,i)=>'<i'+(i===0?' class="on"':'')+'></i>').join('')+'</div>'+slides.map((x,i)=>'<div class="slide'+(i===0?' on':'')+'"><div><div class="lab">'+esc(x[0])+'</div><h1>'+esc(x[1])+'</h1><p>'+esc(x[2])+'</p><a class="btn" href="'+x[4]+'" data-l>'+esc(x[3])+'</a></div>'+logos(x[5])+'</div>').join('')+'<button class="arrow l" onclick="hero(-1)">‹</button><button class="arrow r" onclick="hero(1)">›</button></section>'+
   '<div class="grid4"><div class="cardx"><h3>Treasuries & cash | Held in a wallet</h3>'+t4(sh.treasuries||[],a=>px(a.price))+'<a class="link" href="/markets?class=treasuries" data-l>See more</a></div><div class="cardx"><h3>Gold & metals | Own bullion from $1</h3>'+t4(sh.metals||[],a=>px(a.price))+'<a class="link" href="/markets?class=metals" data-l>See more</a></div><div class="cardx"><h3>Top movers | 30-day performance</h3>'+t4(h.movers,a=>pct(a.ch30))+'<a class="link" href="/markets?sort=ch30" data-l>See all movers</a></div><div class="cardx"><h3>Best graded | Highest FACET scores</h3>'+t4(h.finest,a=>gr(a.letter)+' <span class="mut">'+a.score+'</span>')+'<a class="link" href="/markets?sort=grade" data-l>Rank by grade</a></div></div>'+
   '<div class="grid4"><div class="cardx"><h3>Stocks | Trade on-chain, no account</h3>'+t4(sh.stocks||[],a=>px(a.price))+'<a class="link" href="/markets?class=stocks" data-l>See all stocks</a></div><div class="cardx"><h3>ETFs & indices | Whole markets in one token</h3>'+t4(sh.etfs||[],a=>px(a.price))+'<a class="link" href="/markets?class=etfs" data-l>See all ETFs</a></div><div class="cardx"><h3>Private credit | Loan books on-chain</h3>'+t4(sh.credit||[],a=>px(a.price))+'<a class="link" href="/markets?class=credit" data-l>See all credit</a></div><div class="cardx"><h3>Most traded | 24-hour volume</h3>'+t4(h.traded,a=>usd(a.vol))+'<a class="link" href="/markets?sort=vol" data-l>See all by volume</a></div></div>'+
   '<section class="sec"><div class="why"><div><div class="lab">Why FACET</div><h2>Real-world assets, provable end to end.</h2><p style="color:var(--sub)">A marketplace where every listing carries its evidence: what it is, who issues it, where its contract lives, and whether the supply on-chain matches what the issuer says.</p><div class="nums"><div><b>'+s.assets.toLocaleString()+'</b><span>Graded listings</span></div><div><b>'+s.issuers+'</b><span>Issuers</span></div><div><b>'+usd(s.tracked)+'</b><span>Tracked value</span></div></div></div>'+
   '<div class="feat"><div><h4>Graded before you buy</h4><p>Six measurable signals, 100 points, one grade from AAA to C, with the reason for every point printed on the listing.</p></div><div><h4>Supply you can audit</h4><p>FACET calls the token contract through public nodes and sets the live supply beside the issuer\'s published figure.</p></div><div><h4>Wrapper against wrapper</h4><p>Put two tokens of the same asset side by side and see which one stands up better, and by how many points.</p></div><div><h4>One grade for a whole basket</h4><p>Weight a basket and get a single portfolio score, plus the weakest line the average hides.</p></div><div><h4>Only real assets</h4><p>Narrative coins and protocol tokens are filtered out. A listing here is a claim on something that exists.</p></div><div><h4>Self-custody trading</h4><p>Quotes are routed across on-chain venues. Your wallet signs, and the swap settles to your own address.</p></div></div></div></section>'+
   (h.wrapStats&&h.wrapStats.groups?'<section class="sec"><div class="sech"><div><h2>Best Wrapper <span class="best" style="vertical-align:4px">New</span></h2><p>'+h.wrapStats.groups+' assets are sold by more than one issuer. FACET ranks all '+h.wrapStats.wrappers+' wrappers and names the better buy.</p></div><a class="link" href="/wrappers" data-l>See every asset</a></div><div class="wg" style="grid-template-columns:repeat(4,1fr)">'+h.wrapStats.widest.map(wrapCard).join('')+'</div></section>':'')+'<section class="sec"><div class="sech"><h2>Best sellers in tokenized assets</h2><a class="link" href="/markets" data-l>See all</a></div><div class="rowx">'+[].concat(sh.metals||[],sh.treasuries||[]).sort((x,y)=>y.mcap-x.mcap).slice(0,12).map(prod).join('')+'</div></section>'+
   '<section class="sec"><div class="sech"><div><h2>What can <span id="ownamt">$100</span> own?</h2><p>The same money, as real things. Every line is priced from a live listing.</p></div><div class="amts">'+[10,100,1000,10000].map(v=>'<button class="chip'+(v===100?' on':'')+'" onclick="own('+v+',this)">$'+v.toLocaleString()+'</button>').join('')+'</div></div><div class="own" id="own"></div></section>'+
   '<section class="sec"><div class="sech"><h2>Shop by asset class</h2><a class="link" href="/markets" data-l>All markets</a></div><div class="classes">'+s.classes.filter(c=>c.n).map(c=>'<a href="/markets?class='+c.key+'" data-l>'+esc(c.label)+'<small>'+c.n+' assets</small></a>').join('')+'</div></section>'+
   '<div class="trust"><div><h4>Every listing graded</h4><p>Only asset-backed tokens from known issuers, each scored from signals anyone can re-measure.</p></div><div><h4>On-chain provenance</h4><p>Contract addresses are shown with their explorers, and supply is read from the contract itself.</p></div><div><h4>Live figures</h4><p>Prices, tracked value, volume and supply refresh every few minutes. Nothing is typed in by hand.</p></div></div>';
  OWNDATA=null;own(100);clearInterval(HT);HT=setInterval(()=>{if(location.pathname==='/')hero(1);else clearInterval(HT)},7000);
}
window.hero=(d)=>{const S=document.querySelectorAll('.slide'),D=document.querySelectorAll('.dots i');if(!S.length)return;HERO=(HERO+d+S.length)%S.length;S.forEach((e,i)=>e.classList.toggle('on',i===HERO));D.forEach((e,i)=>e.classList.toggle('on',i===HERO))};
let OWNDATA=null;
window.own=async(v,el)=>{if(el){document.querySelectorAll('.amts .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on')}$('ownamt').textContent='$'+v.toLocaleString();if(!OWNDATA){const r=await api('/api/assets?limit=200&sort=mcap');OWNDATA={};r.items.forEach(a=>OWNDATA[a.id]=a)}
  const A=OWNDATA,L=[];const add=(id,f)=>{if(A[id]&&A[id].price>0)L.push(f(A[id]))};
  add('pax-gold',a=>[(v/a.price*31.1035).toFixed(v<100?3:2)+' grams of vaulted gold','PAXG, one token is one troy ounce']);add('kinesis-silver',a=>[(v/a.price).toFixed(2)+' ounces of silver','KAG, one token is one ounce']);add('ondo-us-dollar-yield',a=>[(v/a.price).toFixed(2)+' USDY','short-term US Treasuries, yield accrues in the price']);
  add('nvidia-xstock',a=>[(v/a.price).toFixed(4)+' NVIDIA shares','NVDAx, share-backed']);add('tesla-xstock',a=>[(v/a.price).toFixed(4)+' Tesla shares','TSLAx, share-backed']);add('sp500-xstock',a=>[(v/a.price).toFixed(4)+' units of the S&P 500','SPYx, the index in one token']);
  add('apple-xstock',a=>[(v/a.price).toFixed(4)+' Apple shares','AAPLx, share-backed']);add('uranium',a=>[(v/a.price).toFixed(2)+' tokens of uranium oxide','xU3O8, physical uranium']);add('janus-henderson-anemoy-aaa-clo-fund',a=>[(v/a.price).toFixed(2)+' units of a AAA CLO fund','JAAA, Janus Henderson Anemoy']);
  if($('own'))$('own').innerHTML=L.slice(0,9).map(x=>'<div><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></div>').join('')||'<div class="empty">Prices are loading.</div>'};

// ---------- markets ----------
async function markets(){
  const P=new URLSearchParams(location.search);const cls=P.get('class')||'',sort=P.get('sort')||'mcap',q=P.get('q')||'';const st=await api('/api/stats');
  app.innerHTML='<div class="crumb"><a href="/" data-l>Home</a> / Markets</div><section class="sec"><div class="sech"><div><h2>All markets</h2><p>'+st.assets.toLocaleString()+' graded listings from '+st.issuers+' issuers, '+usd(st.tracked)+' in tracked value.</p></div></div><div class="tools"><button class="chip'+(!cls?' on':'')+'" onclick="go(\'/markets\')">All</button>'+st.classes.filter(c=>c.n).map(c=>'<button class="chip'+(cls===c.key?' on':'')+'" onclick="go(\'/markets?class='+c.key+'\')">'+esc(c.label)+' · '+c.n+'</button>').join('')+
   '<span style="flex:1"></span><input class="in" id="mq" placeholder="Filter this list" value="'+esc(q)+'" style="width:170px"><select id="ms">'+[['mcap','Largest'],['grade','Best grade'],['vol','Most traded'],['ch24','24h gainers'],['ch30','30d gainers'],['newest','Newest']].map(o=>'<option value="'+o[0]+'"'+(sort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div><div id="mt"><div class="empty">Loading…</div></div></section>';
  const load=async()=>{const r=await api('/api/assets?limit=200&class='+cls+'&sort='+$('ms').value+'&q='+encodeURIComponent($('mq').value));$('mt').innerHTML=r.items.length?'<div style="overflow-x:auto"><table><thead><tr><th>Listing</th><th>Grade</th><th class="hide-s">Class</th><th class="n">Price</th><th class="n">24h</th><th class="n hide-s">30d</th><th class="n hide-s">Tracked value</th><th class="n hide-s">24h volume</th></tr></thead><tbody>'+r.items.map(a=>'<tr class="r" onclick="go(\''+href(a)+'\')"><td><div class="cellname">'+ico(a)+'<div><b>'+esc(a.symbol)+'</b><small>'+esc(a.name)+'</small></div></div></td><td>'+gr(a.letter)+'</td><td class="hide-s mut" style="font-size:13px">'+esc(CLS[a.cls]||a.cls)+'</td><td class="n">'+px(a.price)+'</td><td class="n">'+pct(a.ch24)+'</td><td class="n hide-s">'+pct(a.ch30)+'</td><td class="n hide-s">'+usd(a.mcap)+'</td><td class="n hide-s">'+usd(a.vol)+'</td></tr>').join('')+'</tbody></table></div><p class="note">'+r.total+' listings match.</p>':'<div class="empty">Nothing in the marketplace matches that.</div>'};
  $('ms').onchange=load;let t;$('mq').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};load();
}

// ---------- asset ----------
let CUR=null;
const bars=(g)=>g.parts.map(p=>'<div class="bar2"><span style="font-weight:600;font-size:13.5px">'+esc(p.k)+'</span><span class="t"><i style="width:'+Math.round(100*p.pts/p.max)+'%"></i></span><span class="mono" style="text-align:right;font-size:12.5px">'+p.pts+' / '+p.max+'</span><small>'+esc(p.why)+'</small></div>').join('');
async function asset(id){
  app.innerHTML='<div class="empty">Reading the contract…</div>';const r=await api('/api/asset/'+encodeURIComponent(id));if(r.error){app.innerHTML='<div class="empty">'+esc(r.error)+'</div>';return}
  CUR=r;const a=r.asset,g=r.grade,d=r.detail,s=r.supply;const num=(n)=>n.toLocaleString('en-US',{maximumFractionDigits:2});
  const supply=s&&s.ok?s.per.map(p=>'<div class="kv"><span>'+esc(p.chainName)+' contract</span><span class="mono">'+(p.supply!=null?num(p.supply):esc(p.error))+'</span></div>').join('')+'<div class="kv"><span>Read on-chain, total</span><span class="mono">'+num(s.onchain)+'</span></div>'+(s.published?'<div class="kv"><span>Published supply</span><span class="mono">'+num(s.published)+'</span></div>':'')+'<div class="kv"><span>Difference</span><span class="mono">'+(s.drift!=null?(s.drift>=0?'+':'')+s.drift+'%':s.partial?'part of the supply sits on chains FACET does not read':'—')+'</span></div>':'<div class="pad mut" style="font-size:14px">'+(s&&s.why?esc(s.why):d?'The supply read did not complete. It is retried automatically.':'Contract details are being fetched.')+'</div>';
  const contracts=d&&d.contracts.length?d.contracts.map(c=>'<div class="kv"><span>'+esc(c.chainName)+'</span><span class="mono">'+(c.explorer?'<a class="link" style="font-weight:400;font-size:13px" href="'+esc(c.explorer)+'" target="_blank" rel="noopener">'+esc(c.address)+'</a>':esc(c.address))+'</span></div>').join(''):'<div class="pad mut" style="font-size:14px">No contract address has been published for this listing.</div>';
  const trade=r.routable.length?'<div class="pad"><div class="mut" style="font-size:12.5px;margin-bottom:6px">Pay with</div><div style="display:flex;gap:8px"><select id="tch" style="flex:1;min-width:0">'+r.routable.map((c,i)=>'<option value="'+i+'">'+esc(c.native)+' on '+esc(c.chainName)+'</option>').join('')+'</select><input class="in mono" id="tamt" value="0.05" inputmode="decimal" style="width:104px"></div><button class="btn full" style="margin-top:10px" onclick="quote()">Get a live quote</button><div id="tq"></div><p class="note">Routed by the KyberSwap aggregator across on-chain venues. Your wallet signs and the swap settles from your own address.</p></div>':
   r.solana?'<div class="pad"><p style="font-size:14px;color:var(--sub);margin-bottom:12px">This listing settles on Solana. Route it on Jupiter from your own wallet.</p><a class="btn full" target="_blank" rel="noopener" href="https://jup.ag/swap/SOL-'+esc(r.solana)+'">Open the route on Jupiter</a></div>':'<div class="pad mut" style="font-size:14px">'+(d?'This listing is issued to eligible investors directly by '+esc(a.issuer||'its issuer')+' and has no open on-chain market to route through.':'Looking for a market…')+'</div>';
  app.innerHTML='<div class="crumb"><a href="/markets" data-l>Markets</a> / <a href="/markets?class='+a.cls+'" data-l>'+esc(CLS[a.cls])+'</a> / '+esc(a.symbol)+'</div>'+
   '<section class="sec"><div class="ahead">'+ico(a)+'<div><h1>'+esc(a.name)+' <span class="mut" style="font-weight:500">('+esc(a.symbol)+')</span></h1><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+(s&&s.ok?'<span class="pill g">On-chain verified</span>':'')+'<span class="pill">'+esc(CLS[a.cls])+'</span>'+(a.issuer?'<span class="pill">'+esc(a.issuer)+'</span>':'')+(d?d.contracts.slice(0,4).map(c=>'<span class="pill">'+esc(c.chainName)+'</span>').join(''):'')+'</div></div><div class="pr"><b>'+px(a.price)+'</b>'+pct(a.ch24)+' <span class="mut" style="font-size:12.5px">1D</span><div style="margin-top:10px"><button class="btn ghost sm" onclick="addB(\''+esc(a.id)+'\',this)">'+(B.has(a.id)?'In basket':'Add to basket')+'</button></div></div></div></section>'+
   '<div class="cols" style="margin-top:0"><div><div class="panel"><h3><span>Price</span><span class="rng">'+[['7','1W'],['30','1M'],['90','3M'],['365','1Y']].map(x=>'<button class="'+(x[0]==='30'?'on':'')+'" onclick="drawChart(\''+esc(a.id)+'\','+x[0]+',this)">'+x[1]+'</button>').join('')+'</span></h3><div class="pad" id="chart" style="height:262px"></div></div>'+
   '<div class="panel"><h3><span>FACET Score</span><span style="display:flex;gap:10px;align-items:center"><span class="mono">'+g.score+' / 100</span>'+gr(g.letter)+'</span></h3>'+bars(g)+'</div>'+
   '<div class="panel"><h3><span>Reserve & supply verification</span><span class="mut" style="font-weight:500;font-size:12.5px">'+(s&&s.ok?'read '+new Date(s.ts).toLocaleTimeString():'')+'</span></h3>'+supply+'</div>'+

function docs(){app.innerHTML='<div class="crumb"><a href="/" data-l>Home</a> / Docs</div><section class="sec"><div class="doc"><div class="lab">Method and answers</div><h1 style="font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.05;margin-top:8px">How FACET works</h1>'+
 '<h2>What gets listed</h2><p>Only tokens that represent a claim on a real asset: government paper and money funds, vaulted metals, shares and ETFs held in custody, loan books and structured credit. Protocol tokens, oracle tokens and chains that belong to the real-world-asset narrative are filtered out, because they are not the asset itself.</p>'+
 '<h2>The FACET Score</h2><p>Each listing is scored out of 100 from six signals. The breakdown is printed on the listing, with the reason for every point.</p><pre>Size            25   log scale of tracked value, $300K to $2B\nLiquidity       20   24h turnover; funds redeemed at NAV with the issuer score 10 as a floor\nOn-chain proof  20   contract located (10 to 12), supply read live from a public node (20)\nSupply match    15   on-chain supply against the published figure: under 0.5% = 15, under 2% = 12, under 10% = 7\nTrack record    10   years of price history, full marks at three years\nTracking        10   gold tokens against the median ounce token; NAV products by 30-day drift\n\nAAA 85+   AA 75+   A 65+   BBB 55+   BB 45+   B 35+   C below 35</pre>'+
 '<h2>Supply verification</h2><p>For every listing with a contract on Ethereum, Arbitrum, Base, Polygon or BNB Chain, FACET calls totalSupply() on the contract through public nodes and compares the result with the supply the issuer publishes. When part of a token\'s supply lives on a chain FACET does not read, the listing says so and no difference is claimed.</p>'+
 '<h2>Trading</h2><p>Quotes come from the KyberSwap aggregator, which searches on-chain venues for the best route. FACET relays the route to your wallet. Your wallet signs, the swap settles from your own address, and the tokens arrive in your own address. FACET never holds funds or keys. Listings that settle on Solana open their route on Jupiter. Funds issued only to eligible investors show their issuer instead of a route.</p>'+
 '<h2>Data</h2><p>Prices, tracked value, volume and supply figures come from CoinGecko and refresh every few minutes. Contract addresses come from the same register and are read against public nodes. Every figure on a listing is live; nothing is typed in by hand.</p>'+
 '<h2>Questions</h2>'+[['Is FACET a custodian?','No. There are no accounts and no deposits. You connect a wallet, request a quote, and sign a swap that settles on-chain between your address and the venues on the route.'],['Why do some large funds have no trade button?','Funds such as BUIDL or USYC are issued to eligible investors and redeemed with the issuer at net asset value. They have little or no open on-chain market, so there is nothing to route. Their grade still applies, and it is useful when the same fund appears as collateral elsewhere.'],['What does a low grade mean?','It means fewer of the six signals could be confirmed: a small float, thin trading, no readable contract, or a short record. It is a statement about evidence, and the listing shows exactly which signals were weak.'],['Why might on-chain supply differ from the published figure?','Issuers update published figures on their own schedule, tokens are minted and burned between updates, and some supply can sit on chains that are not read. Small differences are normal. Large ones are worth a closer look, and the grade reflects them.'],['Which wallets work?','Any browser wallet that speaks the standard Ethereum interface, such as MetaMask or Rabby. FACET asks the wallet to switch to the chain the route settles on.'],['Does FACET charge a fee?','When a routing fee is enabled it is included in the quote you see before signing, so the amount you receive on the quote is the amount after the fee.'],['What is $FACET?','$FACET is the token of the marketplace. Its contract address is published here once it is live.'],['What are the risks?','Tokenized assets carry issuer, custody and market risk, and prices move. Read the issuer\'s own documents, check the score breakdown, and size positions accordingly.']].map(x=>'<details><summary>'+esc(x[0])+'</summary><p>'+esc(x[1])+'</p></details>').join('')+'</div></section>'}

$('q').addEventListener('input',()=>{clearTimeout(st);const v=$('q').value.trim();if(!v){$('sug').classList.remove('on');return}st=setTimeout(async()=>{const r=await api('/api/assets?limit=8&q='+encodeURIComponent(v));$('sug').innerHTML=r.items.map(a=>'<a href="'+href(a)+'" data-l>'+ico(a,'style="width:28px;height:28px;border-radius:7px"')+'<span><b>'+esc(a.symbol)+'</b> <span class="mut">'+esc(a.name)+'</span></span><span style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="mono">'+px(a.price)+'</span>'+gr(a.letter)+'</span></a>').join('')||'<a>No match in the marketplace</a>';$('sug').classList.add('on');bindLinks()},200)});
document.addEventListener('click',(e)=>{if(!e.target.closest('.search'))$('sug').classList.remove('on')});$('q').addEventListener('keydown',(e)=>{if(e.key==='Enter')doSearch()});
route();
</script></body></html>
